services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ares
      POSTGRES_PASSWORD: ares_local_dev_only
      POSTGRES_DB: ares
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ares-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ares -d ares"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  ares-postgres-data:
